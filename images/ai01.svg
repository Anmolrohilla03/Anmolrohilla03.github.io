<svg xmlns="http://www.w3.org/2000/svg" width="347" height="164" viewBox="0 0 347 164" fill="none" role="img" aria-labelledby="ai01-title">
  <title id="ai01-title">Price increase in Cotton</title>
  <rect width="347" height="164" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="346" height="163" stroke="#ECECEC"/>
  <g transform="translate(16 15)">
    <rect x="0.5" y="0.5" width="13" height="15" stroke="#C4C4C4" fill="#FFFFFF"/>
    <path d="M4 5.5H10" stroke="#C4C4C4" stroke-width="1" stroke-linecap="round"/>
    <path d="M4 8.5H10" stroke="#C4C4C4" stroke-width="1" stroke-linecap="round"/>
    <path d="M4 11.5H8.5" stroke="#C4C4C4" stroke-width="1" stroke-linecap="round"/>
  </g>
  <text x="38" y="26" fill="#999999" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Apr 2, 2023</text>
  <circle cx="321" cy="22" r="1.5" fill="#888888"/>
  <circle cx="327" cy="22" r="1.5" fill="#888888"/>
  <circle cx="333" cy="22" r="1.5" fill="#888888"/>
  <text x="16" y="52" fill="#333333" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Price increase in Cotton</text>
  <text fill="#888888" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400">
    <tspan x="16" y="72">In a recent development that has caught the attention</tspan>
    <tspan x="16" y="87">of industry analysts and stakeholders, Polychem has</tspan>
    <tspan x="16" y="102">announced a price increase across its product range,</tspan>
    <tspan x="16" y="117">effective June 1, 2024.</tspan>
  </text>
