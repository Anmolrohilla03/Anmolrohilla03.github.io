  <rect x="84" y="129" width="28" height="20" fill="#D4F0E4"/>
  <text x="98" y="143" text-anchor="middle" fill="#2DB87A" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">Ai</text>
